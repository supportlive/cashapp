<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdrawal Flow</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* App Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            position: relative;
            overflow: hidden;
            color: #ffffff;
        }

        /* Screen Manager */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding: 24px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #screen-speed { background-color: #111111; }
        #screen-success { background-color: #000000; }

        /* =========================================================
           SCREEN 1: SPEED SELECTION
        ========================================================= */
        .top-icons { display: flex; justify-content: flex-end; gap: 20px; margin-bottom: 30px; margin-top: 10px; }
        .top-icons a { color: #ffffff; text-decoration: none; font-size: 24px; font-weight: 500; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 40px; line-height: 1.3; }
        .options-list { display: flex; flex-direction: column; gap: 30px; }
        .option-item { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; }
        .radio-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555555; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-top: 2px; }
        .option-item.active .radio-circle { border-color: #48C2E9; }
        .radio-inner { width: 12px; height: 12px; background-color: transparent; border-radius: 50%; }
        .option-item.active .radio-inner { background-color: #48C2E9; }
        .option-text { display: flex; flex-direction: column; gap: 6px; }
        .option-title { font-size: 17px; font-weight: 700; color: #ffffff; }
        .option-desc { font-size: 15px; color: #8e8e93; line-height: 1.4; }
        .option-item.disabled .radio-circle { border-color: #333333; }
        .option-item.disabled .option-title, .option-item.disabled .option-desc { color: #555555; }

        /* =========================================================
           SCREEN 2: INITIATED / SUCCESS SCREEN
        ========================================================= */
        .header-left { display: flex; justify-content: flex-start; padding-top: 10px; }
        .close-btn { color: #ffffff; text-decoration: none; font-size: 26px; font-weight: 300; line-height: 1; cursor: pointer; }

        .success-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 40px;
            margin-bottom: auto;
        }

        .check-badge {
            width: 64px;
            height: 64px;
            background-color: #00D632;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
        }

        .check-badge svg {
            width: 28px;
            height: 28px;
            stroke: #000000;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .headline {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* =========================================================
           COMMON BOTTOM ACTION BUTTONS
        ========================================================= */
        .bottom-action { margin-top: auto; padding-bottom: 20px; width: 100%; }
        .btn-action { display: block; width: 100%; background-color: #48C2E9; color: #ffffff; text-align: center; padding: 18px; border-radius: 30px; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer; border: none; }
        
        .btn-done {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            padding: 18px 0;
            border-radius: 32px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SCREEN 1: SPEED SELECTION -->
        <div id="screen-speed" class="screen active">
            <!-- Header Icons -->
            <div class="top-icons">
                <a href="index.html">?</a>
                <a href="index.html">×</a>
            </div>

            <!-- Title -->
            <div class="page-title">Select your withdrawal<br>speed</div>

            <!-- Speed Options -->
            <div class="options-list">
                <div class="option-item active" onclick="selectOption(this)">
                    <div class="radio-circle"><div class="radio-inner"></div></div>
                    <div class="option-text">
                        <div class="option-title">Priority</div>
                        <div class="option-desc">Arrives in ~10 minutes<br>0.0031 BTC ($265.11) fee</div>
                    </div>
                </div>

                <div class="option-item" onclick="selectOption(this)">
                    <div class="radio-circle"><div class="radio-inner"></div></div>
                    <div class="option-text">
                        <div class="option-title">Rush</div>
                        <div class="option-desc">Arrives in ~2 hours<br>0.0021 BTC ($175.04) fee</div>
                    </div>
                </div>

                <div class="option-item disabled" onclick="selectOption(this)">
                    <div class="radio-circle"><div class="radio-inner"></div></div>
                    <div class="option-text">
                        <div class="option-title">Standard</div>
                        <div class="option-desc">Arrives in ~24 hours<br>Free<br>Minimum 0.0017 BTC ($145.04) fee</div>
                    </div>
                </div>
            </div>

            <!-- Next Button -->
            <div class="bottom-action">
                <a href="#" class="btn-action" onclick="showSuccessScreen(event)">Next</a>
            </div>
        </div>


        <!-- SCREEN 2: WITHDRAWAL INITIATED (SUCCESS) -->
        <div id="screen-success" class="screen">
            <!-- Top Left Close Icon -->
            <div class="header-left">
                <a href="index.html" class="close-btn">✕</a>
            </div>

            <!-- Main Confirmation Message -->
            <div class="success-content">
                <div class="check-badge">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h1 class="headline" id="initiated-headline">
                    You initiated a withdrawal<br>
                    of <span id="display-usd-amount">$100.88</span><br>
                    (<span id="display-btc-amount">0.00125356 BTC</span>)
                </h1>
            </div>

            <!-- Bottom Done Button -->
            <div class="bottom-action">
                <a href="index.html" class="btn-done">Done</a>
            </div>
        </div>

    </div>

    <script>
        // Handle radio option selection
        function selectOption(selectedElement) {
            if(selectedElement.classList.contains('disabled')) return;

            const options = document.querySelectorAll('.option-item');
            options.forEach(opt => opt.classList.remove('active'));
            
            selectedElement.classList.add('active');
        }

        // Handle transaction deduction, pending history addition, and screen change
        function showSuccessScreen(event) {
            event.preventDefault(); 
            
            let sessionData = localStorage.getItem('walletAppSession');
            let intentData = localStorage.getItem('currentTxIntent');

            let usdAmount = 100.88;
            let btcAmount = 0.00125356;
            let targetRecipient = "Bitcoin Withdrawal";
            let mode = "btc";

            if (sessionData && intentData) {
                let userState = JSON.parse(sessionData);
                let intent = JSON.parse(intentData);

                usdAmount = parseFloat(intent.amount) || 100.88;
                mode = intent.mode || "btc";
                targetRecipient = intent.target || "Bitcoin Address";

                const btcPrice = userState.btcPrice || 28507.68;
                btcAmount = usdAmount / btcPrice;

                // 1. Deduct funds based on transfer type
                if (mode === 'btc') {
                    userState.btcHolding = Math.max(0, userState.btcHolding - btcAmount);
                } else {
                    userState.cashBalance = Math.max(0, userState.cashBalance - usdAmount);
                }

                // 2. Push PENDING transaction to history
                const newTx = {
                    id: Date.now(),
                    asset: mode === 'btc' ? 'Bitcoin' : 'Cash',
                    title: targetRecipient,
                    amountDisp: `-$${usdAmount.toFixed(2)}`,
                    subtitle: mode === 'btc' ? `~ ${btcAmount.toFixed(8)} BTC` : `To ${targetRecipient}`,
                    status: 'PENDING',
                    action: 'Withdrawal'
                };

                userState.history.unshift(newTx);

                // 3. Save updated session back to Local Storage
                localStorage.setItem('walletAppSession', JSON.stringify(userState));
                localStorage.removeItem('currentTxIntent');
            }

            // Update UI fields on screen 2
            document.getElementById('display-usd-amount').innerText = `$${usdAmount.toFixed(2)}`;
            document.getElementById('display-btc-amount').innerText = `${btcAmount.toFixed(8)} BTC`;

            // Transition screens
            document.getElementById('screen-speed').classList.remove('active');
            document.getElementById('screen-success').classList.add('active');
        }
    </script>
</body>
</html>
